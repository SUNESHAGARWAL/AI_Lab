[project]
name = "telemetry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-util-genai==1.2b0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]
