[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.95.0",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "tenacity>=9.0",
    "opentelemetry-api>=1.27",
    "core",
    "telemetry",
]

[tool.uv.sources]
core = { workspace = true }
telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
