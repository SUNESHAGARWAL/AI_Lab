[alembic]
script_location = %(here)s/migrations

# sqlalchemy.url is deliberately not set here — pulled dynamically from DATABASE_URL
# (or set programmatically via Config.set_main_option) in migrations/env.py, so the
# same scripts work unchanged across local/CI/production without a checked-in URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
