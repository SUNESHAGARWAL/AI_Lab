[project]
name = "evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepeval==4.1.5",
    "ragas",
    "typer>=0.12",
    "core",
    "retrieval",
    "telemetry",
]

[tool.uv.sources]
core = { workspace = true }
retrieval = { workspace = true }
telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
