[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "core",
    "llm",
    "retrieval",
    "telemetry",
]

[tool.uv.sources]
core = { workspace = true }
llm = { workspace = true }
retrieval = { workspace = true }
telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
